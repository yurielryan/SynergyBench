model:
  provider: qwen
  # Supported providers: qwen, openai, gemini, llama, llava
  size: "8b"
  # Optional: set exact Hugging Face model id (overrides size)
  # model_id: "Qwen/Qwen3-VL-8B-Instruct"
  torch_dtype: "auto"
  device_map: "auto"
  max_new_tokens: 4
  system_prompt: "You are a sarcasm classifier. Answer with exactly one token: yes or no."
  # Optional API key override for provider=openai or provider=gemini.
  # If omitted, wrappers read OPENAI_API_KEY or GEMINI_API_KEY from env.
  # api_key: ""
  # Optional Gemini generation knob.
  # temperature: 0.0

  # Example OpenAI config:
  # provider: openai
  # model_id: "gpt-4.1-mini"

  # Example Gemini config:
  # provider: gemini
  # model_id: "gemini-2.0-flash"

  # Example Llama text model config:
  # provider: llama
  # model_id: "meta-llama/Llama-3.2-3B-Instruct"

  # Example LLaVA multimodal model config:
  # provider: llava
  # model_id: "llava-hf/llava-1.5-7b-hf"

  # Optional generic loader for custom VLM wrappers:
  # loader: "my_package.my_model:load_model"
  # kwargs:
  #   model_id: "my/model-id"

data:
  dataset_path: "docmsu_2500_split.json"
  split: "all"
  image_dir: "img"

output:
  output_path: "results/inference.json"
