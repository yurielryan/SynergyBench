model:
  provider: qwen
  size: "8b"
  # Optional: set exact Hugging Face model id (overrides size)
  # model_id: "Qwen/Qwen3-VL-8B-Instruct"
  torch_dtype: "auto"
  device_map: "auto"
  max_new_tokens: 4
  system_prompt: "You are a sarcasm classifier. Answer with exactly one token: yes or no."
  # Optional generic loader for custom VLM wrappers:
  # loader: "my_package.my_model:load_model"
  # kwargs:
  #   model_id: "my/model-id"

data:
  dataset_path: "docmsu_2500_split.json"
  split: "all"
  image_dir: "img"

output:
  output_path: "results/inference.json"
